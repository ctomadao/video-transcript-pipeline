[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcript-pipeline"
version = "0.1.0"
description = "Batch PT-BR video transcription for Atlas Brasileiro (Kim Paim)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.0",
  "tqdm>=4.66",
  "rich>=13.0",
  "click>=8.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
vtp = "vtp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
